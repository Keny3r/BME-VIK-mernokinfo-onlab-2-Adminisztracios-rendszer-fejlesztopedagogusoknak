								/>
							</svg>
							<span>Fejlesztési területek</span>
						</a>
					</li>

			<!-- Főtartalom terület -->
			<div class="drawer-content">

				<header class="navbar">
					<div class="flex items-center gap-2">
						<a href="profile.html" class="navbar-brand">BTMN Admin</a>
					</div>

					<div class="flex items-center gap-3">
						<div class="avatar-badge" title="Bejelentkezett pedagógus (nem kattintható)">

						</div>
					</div>
				</header>

				<main class="main-container">

						<div class="flex items-center gap-3">
							<svg
								style="

							<h1 class="card-title" style="font-size: 1.85rem">Foglalkozások</h1>
						</div>

						<!-- Foglalkozások kártya (1:1 a SvelteKit SessionListItem mintájára) -->

												stroke: currentColor;
												fill: none;

									<li class="divide-item">
										<a
											href="session-modal.html"
											class="divide-item-clickable flex min-w-0 flex-1 items-start gap-6"
										>
											<!-- Dátum -->
											<div class="flex shrink-0 items-center gap-2 pt-0.5">
												<svg
													style="
														width: 20px;
														height: 20px;
														color: var(--color-primary);
														stroke: currentColor;
														fill: none;
														stroke-width: 2;
													"
													viewBox="0 0 24 24"
												>
													<path
														stroke-linecap="round"
														stroke-linejoin="round"

											</div>

											<div class="flex min-w-0 flex-1 flex-col gap-1">
												<div class="flex items-center gap-2">

													<span class="truncate font-medium">Kovács Ádám</span>
												</div>
												<div class="flex items-center gap-2">
													<span class="badge badge-xs font-semibold badge-neutral">3.a</span>
													<span class="truncate font-medium">Nagy Bence</span>
												</div>
											</div>
										</a>

										<div class="shrink-0">
											<button
												type="button"
												class="btn btn-square btn-ghost text-error btn-sm"
												title="Foglalkozás törlése"
											>
												<svg
													style="
														width: 16px;
														height: 16px;
														stroke: currentColor;
														fill: none;
														stroke-width: 2;
													"
													viewBox="0 0 24 24"
												>
													<path
														stroke-linecap="round"
														stroke-linejoin="round"

													<span class="badge badge-xs font-semibold badge-neutral">5.b</span>
													<span class="truncate font-medium">Horváth Dániel</span>

											</div>
										</a>

											<button
												type="button"

														height: 16px;
														stroke: currentColor;
